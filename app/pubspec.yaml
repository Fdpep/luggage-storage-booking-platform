name: BagDrop
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.10.3
  flutter_dotenv: ^6.0.0
  go_router: ^16.3.0
  intl: ^0.20.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  flutter_map_cancellable_tile_provider: ^2.0.0
  collection: ^1.19.1
  smooth_page_indicator: ^1.2.0
  shared_preferences: ^2.3.2
  geolocator: ^12.0.0  # Plugin per ottenere la posizione GPS
  http: ^1.2.2         # per chiamare le API di geocoding
  image_picker: ^1.1.2 # per scegliere le foto dal dispositivo

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    # env
    - .env
    - .env.android

    # immagini dal primo progetto
    - assets/images/brand/logo.png
    - assets/images/brand/logo_splash.png   # aggiunta perché usata dallo splash
    - assets/images/onboarding/

# Splash screen iniziale con logo
flutter_native_splash:
  color: "#4B3FE4"
  image: assets/images/brand/logo.png

  android: true
  ios: true
  web: true

  android_gravity: center
  ios_content_mode: center
  web_image_mode: center

  android_12:
    color: "#4B3FE4"
    image: assets/images/brand/logo_splash.png
    icon_background_color: "#4B3FE4"

