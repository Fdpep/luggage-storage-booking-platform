// --------- HELPERS CAPACITÀ (coerente con DB v2: base in M, salvataggio in unità S = "u") ----------
function parseNonNegative(v){
  const n = parseInt(String(v ?? "").trim(), 10);
  if(Number.isNaN(n) || n < 0) return 0;
  return n;
}

// Conversioni: 1M = 2S, 1L = 4S
function computeCapacitiesV2({ baseM, extraS, extraM, extraL, acceptS=true, acceptM=true, acceptL=true }){
  const m = parseNonNegative(baseM);
  const exS = parseNonNegative(extraS);
  const exM = parseNonNegative(extraM);
  const exL = parseNonNegative(extraL);

  // base in unità S (u)
  const base_u = m * 2;

  // display equivalenze della base (solo UI)
  const baseS = base_u;                    // S
  const baseM_disp = m;                    // M
  const baseL = Math.floor(base_u / 4);    // L

  // effective per taglia (solo UI) + rispettano accept
  const capS = (acceptS ? (base_u + exS) : 0);
  const capM = (acceptM ? (Math.floor(base_u / 2) + exM) : 0);
  const capL = (acceptL ? (Math.floor(base_u / 4) + exL) : 0);

  // Totale in unità equivalenti S (u) = S*1 + M*2 + L*4
  const total_u = (capS * 1) + (capM * 2) + (capL * 4);

  return {
    baseM: m,
    base_u,
    baseS,
    baseM_disp,
    baseL,
    capS,
    capM,
    capL,
    total_u
  };
}

    // "H:MM" -> "HH:MM"
    const t = String(s || "").trim();
    if(!t.includes(":")) return "";
    const [h, m] = t.split(":");
    const hh = String(parseInt(h, 10)).padStart(2, "0");
    const mm = String(parseInt(m, 10)).padStart(2, "0");
    return `${hh}:${mm}`;
  }

  function timeToMinutes(hhmm){
    const [h,m] = hhmm.split(":").map(x => parseInt(x,10));
    return (h*60) + m;
  }

  function overlap(aOpen, aClose, bOpen, bClose){
    const aS = timeToMinutes(aOpen), aE = timeToMinutes(aClose);
    const bS = timeToMinutes(bOpen), bE = timeToMinutes(bClose);
    return aS < bE && bS < aE;

    const fetchAddressSuggestions = async (text) => {
      const q = (text || '').trim();
      if (q.length < 3) {
        setAddrSuggestions([]);
        return;
      }

      if (!window.google || !window.google.maps || !window.google.maps.places) {

        return;

      setAddrLoading(true);

      const service = new window.google.maps.places.AutocompleteService();
      service.getPlacePredictions(

          input: q,
          types: ['address'],
          // Facoltativo: limita ai risultati in Italia
          componentRestrictions: { country: 'it' },
        },
        (predictions, status) => {
          setAddrLoading(false);
          if (status !== window.google.maps.places.PlacesServiceStatus.OK || !predictions) {
            setAddrSuggestions([]);
            return;
          }
            const list = predictions.map(p => p.description);
            setAddrSuggestions(list);
            setAddrActiveIndex(list.length ? 0 : -1);
        }
      );
    };

    const handleAddressChange = (e) => {

    const handleAddressKeyDown = (e) => {
      if (!addrSuggestions.length) return;

      if (e.key === "ArrowDown") {
        e.preventDefault();
        setAddrActiveIndex((i) => {
          const next = i < 0 ? 0 : Math.min(i + 1, addrSuggestions.length - 1);
          return next;
        });
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        setAddrActiveIndex((i) => Math.max(i - 1, 0));

      if (pan) mapRef.current.panTo(pos);

      // Zoom opzionale: usalo quando arriviamo da un indirizzo
      if (typeof zoom === "number") {
        const z = Math.max(mapRef.current.getZoom() || 0, zoom); // non zoomare "indietro"
        mapRef.current.setZoom(z);

      // backend-only

      setField("lng", lng);
    };


    const geocodeAddressToLatLng = (addressText) =>
      new Promise((resolve, reject) => {
        if (!ensureMapsReady()) return reject(new Error("Google Maps non è pronto."));
        const italyBounds = new window.google.maps.LatLngBounds(
          new window.google.maps.LatLng(35.49, 6.62),   // SW
          new window.google.maps.LatLng(47.10, 18.52)   // NE

          const r = results[0];

          resolve({

    // ======================= PROFILE HELPERS (NO DOWNGRADE ROLE) =======================

async function ensureUserProfileSafe({ userId, fullName }) {
  // 1) leggi profilo esistente
  const { data: existing, error: exErr } = await sb
    .from("user_profiles")
    .select("id, role, full_name")
    .eq("id", userId)
    .maybeSingle();

  if (exErr) throw exErr;

  // 2) se non esiste, crea con role=user
  if (!existing) {
    const { error: insErr } = await sb.from("user_profiles").insert({
      id: userId,
      full_name: fullName || null,
      role: "partner_candidate",
    });
    if (insErr) throw insErr;
    return { role: "user" };
  }

  // 3) se esiste, aggiorna solo full_name se vuoto o diverso (ma NON toccare role se già partner/partner_candidate/admin)
  const currentRole = existing.role || "partner_candidate";
  const updates = {};

  if (fullName && (!existing.full_name || existing.full_name.trim() !== fullName.trim())) {
    updates.full_name = fullName.trim();
  }

  // ruolo: se nullo -> partner_candidate; se è user -> partner_candidate (mai downgrade)
  if (!existing.role || existing.role === "user") {
    updates.role = "partner_candidate";
  }

  if (Object.keys(updates).length) {
    const { error: updErr } = await sb
      .from("user_profiles")
      .update(updates)
      .eq("id", userId);
    if (updErr) throw updErr;
  }

  return { role: currentRole };
}

async function getMyRoleSafe(userId) {
  const { data, error } = await sb
    .from("user_profiles")
    .select("role")
    .eq("id", userId)
    .maybeSingle();

  if (error) throw error;
  return data?.role ?? "user";
}

function openTimeModal(day, index = null){
  setMsg(null);
  setTimeModalDay(day);
  setTimeModalIndex(index);

  const curr = weekly[day] || [];
  if(index !== null && curr[index]){
    setTimeOpen(curr[index].open);
    setTimeClose(curr[index].close);
  } else {
    setTimeOpen("09:00");
    setTimeClose("13:00");
  }

  setTimeModalOpen(true);
}

function closeTimeModal(){
  setTimeModalOpen(false);
  setTimeModalIndex(null);
}

function upsertInterval(){
  const day = timeModalDay;
  const curr = weekly[day] || [];

  // max 2 fasce se nuova
  if(timeModalIndex === null && curr.length >= 2){
    setMsg({ type:"error", text:"Puoi impostare al massimo due fasce orarie per giorno." });
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }

  const o = normalizeTimeStr(timeOpen);
  const c = normalizeTimeStr(timeClose);

  if(!o || !c){
    setMsg({ type:"error", text:"Formato orario non valido. Usa HH:MM." });
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  if(timeToMinutes(o) >= timeToMinutes(c)){
    setMsg({ type:"error", text:"La chiusura deve essere dopo l'apertura." });
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }

  // overlap check (escludo se sto editando la stessa fascia)
  for(let i=0; i<curr.length; i++){
    if(timeModalIndex !== null && i === timeModalIndex) continue;
    const it = curr[i];
    if(overlap(o, c, it.open, it.close)){
      setMsg({ type:"error", text:"Gli orari si sovrappongono a una fascia già inserita." });
      window.scrollTo({ top: 0, behavior: "smooth" });
      return;
    }
  }

  const next = [...curr];
  if(timeModalIndex === null){
    next.push({ open:o, close:c });
  } else {
    next[timeModalIndex] = { open:o, close:c };
  }
  next.sort((a,b)=>timeToMinutes(a.open)-timeToMinutes(b.open));

  setWeekly(prev => ({ ...prev, [day]: next }));
  closeTimeModal();
}

function removeInterval(day, idx){
  const next = [...(weekly[day]||[])];
  next.splice(idx, 1);
  setWeekly(prev => ({ ...prev, [day]: next }));
}

function setClosedDay(day){
  setWeekly(prev => ({ ...prev, [day]: [] }));
}

function copyDayToTargets(fromDay, targets){
  const src = weekly[fromDay] || [];
  if(!src.length){
    setMsg({ type:"error", text:`Imposta prima gli orari di ${dayLabels[fromDay]}.` });
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const patch = {};
  targets.forEach(d => patch[d] = src.map(x => ({...x})));
  setWeekly(prev => ({ ...prev, ...patch }));
  setMsg(null);
}

                {loading ? "Invio in corso…" : "Conferma e invia richiesta"}
              </button>
            </div>

            <div className="text-xs text-gray-500">
              Inviando la richiesta, verrà creata/aggiornata la riga in <b>partners</b> e inserita una nuova riga in <b>partner_requests</b> con stato <b>submitted</b>.
            </div>
          </div>
        )}

      </div>
    );
  }

  const root = document.getElementById("partner-wizard-root");
  ReactDOM.createRoot(root).render(<App />);
}

setTimeout(initWizard, 200);
</script>
